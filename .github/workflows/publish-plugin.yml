name: publish-plugin

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windy-publish-${{ github.repository }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      name: ${{ steps.package.outputs.name }}
      version: ${{ steps.package.outputs.version }}
      tag: ${{ steps.package.outputs.tag }}
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - name: Check out the selected commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Run tests
        run: npm test

      - name: Check Windy configuration types
        run: npm run check

      - name: Build the plugin
        run: npm run build

      - name: Validate and package the distribution
        id: package
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { appendFileSync, readFileSync, readdirSync, statSync, writeFileSync } from 'node:fs';

          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const config = JSON.parse(readFileSync('dist/plugin.json', 'utf8'));
          assert.match(config.name, /^windy-plugin-[a-z0-9-]+$/);
          assert.match(config.version, /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/);
          assert.equal(config.name, pkg.name, 'Package and plugin names must match');
          assert.equal(config.version, pkg.version, 'Package and plugin versions must match');
          assert.equal(config.repository, `https://github.com/${process.env.GITHUB_REPOSITORY}`);
          assert.match(process.env.GITHUB_SHA, /^[a-f0-9]{40}$/);
          for (const entry of readdirSync('dist', { withFileTypes: true })) {
            assert.ok(entry.isFile(), `Unexpected distribution entry: ${entry.name}`);
          }
          for (const file of ['plugin.js', 'plugin.js.map', 'plugin.min.js', 'plugin.json', 'package.json', 'LICENSE', 'THIRD_PARTY_NOTICES.md']) {
            assert.ok(statSync(`dist/${file}`).size > 0, `Missing or empty distribution file: ${file}`);
          }
          for (const file of ['LICENSE', 'THIRD_PARTY_NOTICES.md']) {
            assert.deepEqual(readFileSync(`dist/${file}`), readFileSync(file), `License copy differs: ${file}`);
          }
          // These are the provenance fields required by Windy's official template.
          Object.assign(config, {
            repositoryName: process.env.GITHUB_REPOSITORY,
            commitSha: process.env.GITHUB_SHA,
            repositoryOwner: process.env.GITHUB_REPOSITORY_OWNER,
          });
          writeFileSync('dist/plugin.json', `${JSON.stringify(config, null, 2)}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `name=${config.name}\nversion=${config.version}\ntag=v${config.version}\n`);
          NODE
          mkdir release
          tar -cf release/plugin.tar -C dist .
          cd release
          sha256sum plugin.tar > plugin.tar.sha256

      - name: Retain the exact archive and checksum
        id: artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package.outputs.name }}-${{ steps.package.outputs.version }}-${{ github.sha }}
          path: release/*
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      PLUGIN_NAME: ${{ needs.build.outputs.name }}
      PLUGIN_VERSION: ${{ needs.build.outputs.version }}
      RELEASE_TAG: ${{ needs.build.outputs.tag }}
    steps:
      - name: Check the publishing secret
        env:
          WINDY_API_KEY: ${{ secrets.WINDY_API_KEY }}
        run: |
          if [ -z "$WINDY_API_KEY" ]; then
            echo 'Repository secret WINDY_API_KEY is not configured. Create a Windy Plugins API key at https://api.windy.com/keys and add it to Settings > Secrets and variables > Actions.' >&2
            exit 1
          fi

      - name: Download the validated archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: release
          digest-mismatch: error

      - name: Verify the archive and reserve a new release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release
          sha256sum --check plugin.tar.sha256
          # A new Windy version must have a new release. Never replace an old tag.
          gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$RELEASE_TAG" > existing-tags.json
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name' > existing-releases.txt
          if jq -e --arg ref "refs/tags/$RELEASE_TAG" 'any(.[]; .ref == $ref)' existing-tags.json >/dev/null || grep -Fxq "$RELEASE_TAG" existing-releases.txt; then
            echo "Release $RELEASE_TAG already exists. Increase the version in package.json and src/pluginConfig.ts before publishing a new version." >&2
            exit 1
          fi
          printf 'Validated plugin build from commit `%s`.\n\nWindy upload is pending; this release remains a draft until the installation URL and served plugin bytes are verified.\n' "$GITHUB_SHA" > release-notes.md
          gh release create "$RELEASE_TAG" plugin.tar plugin.tar.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "GNARLYPIRATTE $PLUGIN_VERSION" --notes-file release-notes.md --draft

      - name: Publish Plugin
        id: windy
        env:
          WINDY_API_KEY: ${{ secrets.WINDY_API_KEY }}
        run: |
          umask 077
          header_file=$(mktemp "$RUNNER_TEMP/windy-header.XXXXXX")
          response_file=$(mktemp "$RUNNER_TEMP/windy-response.XXXXXX")
          trap 'rm -f "$header_file" "$response_file"' EXIT
          printf 'x-windy-api-key: %s\n' "$WINDY_API_KEY" > "$header_file"
          # Do not echo the secret, headers, or response body, and do not retry POST.
          curl --silent --show-error --fail-with-body --proto '=https' --tlsv1.2 \
            --connect-timeout 15 --max-time 120 --request POST \
            --header "@$header_file" --form 'plugin_archive=@release/plugin.tar' \
            --output "$response_file" 'https://node.windy.com/plugins/v1.0/upload'
          WINDY_RESPONSE_FILE="$response_file" python3 <<'PY'
          import json, os, re
          from pathlib import Path

          body = Path(os.environ['WINDY_RESPONSE_FILE']).read_text(encoding='utf-8')
          texts = [body]
          def collect(value):
              if isinstance(value, str):
                  texts.append(value)
              elif isinstance(value, dict):
                  for item in value.values():
                      collect(item)
              elif isinstance(value, list):
                  for item in value:
                      collect(item)
          try:
              collect(json.loads(body))
          except json.JSONDecodeError:
              pass
          pattern = r'https://windy-plugins\.com/[0-9]+/' + re.escape(os.environ['PLUGIN_NAME']) + '/' + re.escape(os.environ['PLUGIN_VERSION']) + r'/plugin\.min\.js'
          urls = {url for text in texts for url in re.findall(pattern, text)}
          if len(urls) != 1:
              raise SystemExit('Windy did not return one installation URL for the expected plugin and version. The response body was withheld to protect credentials; review the upload with Windy before retrying.')
          url = urls.pop()
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'url={url}\n')
          print(f'Windy returned installation URL: {url}')
          PY

      - name: Verify the published plugin file
        env:
          PLUGIN_URL: ${{ steps.windy.outputs.url }}
        run: |
          # Only this read-only request retries, allowing time for Windy's CDN.
          curl --silent --show-error --fail --proto '=https' --tlsv1.2 \
            --connect-timeout 15 --max-time 120 --retry 4 --retry-delay 5 --retry-all-errors \
            --output release/published-plugin.min.js "$PLUGIN_URL"
          tar -xOf release/plugin.tar ./plugin.min.js > release/expected-plugin.min.js
          if ! cmp --silent release/expected-plugin.min.js release/published-plugin.min.js; then
            echo 'The served plugin differs from the uploaded build. The GitHub release remains a draft; review the Windy publication before retrying.' >&2
            exit 1
          fi

      - name: Publish the verified GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PLUGIN_URL: ${{ steps.windy.outputs.url }}
        run: |
          printf 'Install the Windy plugin: %s\n\nSource commit: `%s`\n\nThe release archive includes all distribution files, the MIT license, and third-party notices. The served plugin.min.js was verified against this archive. The plugin visibility remains as configured in src/pluginConfig.ts.\n' "$PLUGIN_URL" "$GITHUB_SHA" > release/release-notes.md
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --notes-file release/release-notes.md
          printf '### GNARLYPIRATTE %s published\n\n[Install the Windy plugin](%s)\n\n[GitHub release](https://github.com/%s/releases/tag/%s)\n\nSource commit: `%s`\n\nArchive SHA-256: `%s`\n' \
            "$PLUGIN_VERSION" "$PLUGIN_URL" "$GITHUB_REPOSITORY" "$RELEASE_TAG" "$GITHUB_SHA" \
            "$(cut -d ' ' -f 1 release/plugin.tar.sha256)" >> "$GITHUB_STEP_SUMMARY"
